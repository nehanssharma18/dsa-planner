<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DSA Pattern Planner</title>
<meta name="theme-color" content="#d9622b">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#fafaf7;--card:#fff;--tx:#1c1c1a;--mut:#6b6b66;--bd:#e4e3dc;--ac:#d9622b;--acs:#fbeee6;--ok:#2f8f5b;--E:#2f8f5b;--M:#b7791f;--H:#c0392b;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161615;--card:#1f1f1d;--tx:#ecebe6;--mut:#9a9992;--bd:#33332f;--ac:#f08550;--acs:#2e2119;--ok:#4cc08a;--E:#4cc08a;--M:#e0a843;--H:#ee6a5b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#161615;--card:#1f1f1d;--tx:#ecebe6;--mut:#9a9992;--bd:#33332f;--ac:#f08550;--acs:#2e2119;--ok:#4cc08a;--E:#4cc08a;--M:#e0a843;--H:#ee6a5b;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.w{max-width:820px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:24px;margin:0 0 4px}
.sub{color:var(--mut);margin:0 0 16px;font-size:14px}
.bar{height:8px;background:var(--bd);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ac);border-radius:99px;transition:width .3s}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}
.stat{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:8px 14px;font-size:13px;color:var(--mut)}
.stat b{display:block;font-size:20px;color:var(--tx)}
.tool{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
button,select,input,textarea{font:inherit;color:var(--tx)}
button,select{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:6px 12px;cursor:pointer}
button:hover{border-color:var(--ac)}
details.p{background:var(--card);border:1px solid var(--bd);border-radius:12px;margin-bottom:10px}
details.p.cur{border-color:var(--ac)}
summary{cursor:pointer;padding:12px 14px;display:flex;align-items:center;gap:10px;list-style:none}
summary::-webkit-details-marker{display:none}
.num{width:26px;height:26px;border-radius:50%;background:var(--acs);color:var(--ac);display:grid;place-items:center;font-size:13px;font-weight:600;flex:none}
.pn{flex:1;font-weight:600}
.tag{font-size:11px;background:var(--ac);color:#fff;padding:2px 8px;border-radius:99px;margin-left:6px;font-weight:500}
.cnt{color:var(--mut);font-size:13px;white-space:nowrap}
.pb{padding:0 14px 14px}
.tip{background:var(--acs);border-radius:8px;padding:8px 12px;font-size:14px;margin-bottom:10px}
textarea,input[type=text]{width:100%;background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:8px 10px}
textarea{min-height:80px;resize:vertical}
.lbl{font-size:12px;color:var(--mut);margin:10px 0 4px;text-transform:uppercase;letter-spacing:.04em}
.pr{border-top:1px solid var(--bd);padding:8px 0}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.row a{flex:1;min-width:140px;color:var(--tx);text-decoration:none;font-weight:500}
.row a:hover{color:var(--ac);text-decoration:underline}
.pr.done a{color:var(--mut);text-decoration:line-through}
.d{font-size:12px;font-weight:600}
.d.E{color:var(--E)}.d.M{color:var(--M)}.d.H{color:var(--H)}
.nb{font-size:13px;padding:4px 10px}
.dot{color:var(--ac)}
.add{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.add input{flex:1;min-width:120px}
.code{font:13px/1.45 ui-monospace,Menlo,Consolas,monospace;min-height:130px;white-space:pre;overflow:auto}
.g{background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:2px 12px;margin:8px 0;font-size:14px}
.g summary{padding:8px 0;font-weight:600}
.g p{margin:4px 0}
.g pre{background:var(--card);border:1px solid var(--bd);border-radius:6px;padding:8px;overflow:auto;font-size:12.5px;margin:6px 0}
#sv{color:var(--ok);font-size:13px;align-self:center}
#io{display:none;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:14px}
#io textarea{min-height:120px;font:12px monospace}
</style></head>
<body><div class="w">
<h1>DSA Pattern Planner</h1>
<p class="sub">Master one pattern at a time. Track status, write notes, revisit what you forgot.</p>
<div class="bar"><i id="ob" style="width:0"></i></div>
<div class="stats" id="stats"></div>
<div class="tool">
<select id="flt"><option value="all">All problems</option><option value="todo">Not solved yet</option><option value="Revisit">Revisit list</option></select>
<button id="ex">Backup / restore</button><span id="sv">Changes save automatically</span>
</div>
<div id="io"><div class="lbl">Copy this to back up. Paste a backup and press Load to restore.</div><textarea id="iot"></textarea><div class="row" style="margin-top:8px"><button id="ld">Load</button><button id="cl">Close</button><span id="msg" class="cnt"></span></div></div>
<div id="list"></div>
</div>
<script>
const D=[
{id:"arr",n:"Arrays & Hashing",tip:"A hash map turns O(n²) lookups into O(1). Ask: what do I need to remember about elements I have already seen?",p:["Contains Duplicate|contains-duplicate|E","Two Sum|two-sum|E","Valid Anagram|valid-anagram|E","Group Anagrams|group-anagrams|M","Top K Frequent Elements|top-k-frequent-elements|M","Product of Array Except Self|product-of-array-except-self|M","Longest Consecutive Sequence|longest-consecutive-sequence|M"]},
{id:"tp",n:"Two Pointers",tip:"Sorted input, pairs or palindromes: move two indices inward. Ask: which pointer can I safely move, and why?",p:["Valid Palindrome|valid-palindrome|E","Two Sum II|two-sum-ii-input-array-is-sorted|M","3Sum|3sum|M","Container With Most Water|container-with-most-water|M","Trapping Rain Water|trapping-rain-water|H"]},
{id:"sw",n:"Sliding Window",tip:"Contiguous subarray or substring with a condition: expand right, shrink left while the window is invalid.",p:["Best Time to Buy and Sell Stock|best-time-to-buy-and-sell-stock|E","Longest Substring Without Repeating Characters|longest-substring-without-repeating-characters|M","Longest Repeating Character Replacement|longest-repeating-character-replacement|M","Permutation in String|permutation-in-string|M","Minimum Window Substring|minimum-window-substring|H","Sliding Window Maximum|sliding-window-maximum|H"]},
{id:"stk",n:"Stack",tip:"Matching or nesting, or next greater element: a monotonic stack keeps only useful candidates.",p:["Valid Parentheses|valid-parentheses|E","Min Stack|min-stack|M","Daily Temperatures|daily-temperatures|M","Car Fleet|car-fleet|M","Largest Rectangle in Histogram|largest-rectangle-in-histogram|H"]},
{id:"bs",n:"Binary Search",tip:"Sorted data or a monotonic answer space. Ask: what condition flips from false to true, and where?",p:["Binary Search|binary-search|E","Search a 2D Matrix|search-a-2d-matrix|M","Koko Eating Bananas|koko-eating-bananas|M","Find Minimum in Rotated Sorted Array|find-minimum-in-rotated-sorted-array|M","Search in Rotated Sorted Array|search-in-rotated-sorted-array|M","Median of Two Sorted Arrays|median-of-two-sorted-arrays|H"]},
{id:"ll",n:"Linked List",tip:"Use a dummy head, slow/fast pointers, and in-place reversal. Draw the pointers before coding.",p:["Reverse Linked List|reverse-linked-list|E","Merge Two Sorted Lists|merge-two-sorted-lists|E","Linked List Cycle|linked-list-cycle|E","Reorder List|reorder-list|M","Remove Nth Node From End of List|remove-nth-node-from-end-of-list|M","LRU Cache|lru-cache|M","Merge k Sorted Lists|merge-k-sorted-lists|H"]},
{id:"tr",n:"Trees (DFS / BFS)",tip:"Recursion: what does a child return, and what do I compute at this node? Use a queue for level order.",p:["Invert Binary Tree|invert-binary-tree|E","Maximum Depth of Binary Tree|maximum-depth-of-binary-tree|E","Diameter of Binary Tree|diameter-of-binary-tree|E","Binary Tree Level Order Traversal|binary-tree-level-order-traversal|M","Validate Binary Search Tree|validate-binary-search-tree|M","Lowest Common Ancestor of a Binary Search Tree|lowest-common-ancestor-of-a-binary-search-tree|M","Binary Tree Maximum Path Sum|binary-tree-maximum-path-sum|H"]},
{id:"hp",n:"Heap / Priority Queue",tip:"Top-K or streaming min/max: a heap of size K gives O(n log k).",p:["Kth Largest Element in a Stream|kth-largest-element-in-a-stream|E","Last Stone Weight|last-stone-weight|E","K Closest Points to Origin|k-closest-points-to-origin|M","Task Scheduler|task-scheduler|M","Find Median from Data Stream|find-median-from-data-stream|H"]},
{id:"bt",n:"Backtracking",tip:"Choose, explore, un-choose. Draw the decision tree first and prune early.",p:["Subsets|subsets|M","Combination Sum|combination-sum|M","Permutations|permutations|M","Word Search|word-search|M","Palindrome Partitioning|palindrome-partitioning|M","N-Queens|n-queens|H"]},
{id:"gr",n:"Graphs",tip:"DFS or BFS with a visited set. Dependencies mean topological sort. Multi-source BFS for spreading problems.",p:["Number of Islands|number-of-islands|M","Clone Graph|clone-graph|M","Rotting Oranges|rotting-oranges|M","Pacific Atlantic Water Flow|pacific-atlantic-water-flow|M","Course Schedule|course-schedule|M","Word Ladder|word-ladder|H"]},
{id:"d1",n:"1-D Dynamic Programming",tip:"Define state, recurrence and base case. Write recursion with memo first, then convert to bottom-up.",p:["Climbing Stairs|climbing-stairs|E","House Robber|house-robber|M","Coin Change|coin-change|M","Longest Increasing Subsequence|longest-increasing-subsequence|M","Word Break|word-break|M","Partition Equal Subset Sum|partition-equal-subset-sum|M"]},
{id:"d2",n:"2-D Dynamic Programming",tip:"State has two indices (i, j). Decide what dp[i][j] means, then fill the table in dependency order.",p:["Unique Paths|unique-paths|M","Coin Change II|coin-change-ii|M","Longest Common Subsequence|longest-common-subsequence|M","Edit Distance|edit-distance|M"]},
{id:"gi",n:"Greedy & Intervals",tip:"Prove the local best choice never hurts. For intervals, sort by start (or end) first.",p:["Maximum Subarray|maximum-subarray|M","Jump Game|jump-game|M","Merge Intervals|merge-intervals|M","Insert Interval|insert-interval|M","Non-overlapping Intervals|non-overlapping-intervals|M"]}
];
D.forEach(p=>p.items=p.p.map(s=>{const[t,sl,d]=s.split("|");return{t,sl,d}}));
const G={
"contains-duplicate":{w:"Given an integer array, return true if any value appears at least twice, otherwise false.",t:"Brute force compares every pair: O(n²). A hash set remembers values already seen; lookup and insert are O(1) on average, so one pass is O(n) time and O(n) space. Pattern: have I seen this before? Use a hash set.",d:"nums = [1,2,3,1]\nx=1 -> set {} has no 1 -> add -> {1}\nx=2 -> not in set -> add -> {1,2}\nx=3 -> not in set -> add -> {1,2,3}\nx=1 -> already in {1,2,3} -> return true"},
"two-sum":{w:"Return the indices of the two numbers that add up to target. Exactly one answer exists and you cannot reuse the same element.",t:"For each x you need target - x (the complement). Keep a hash map of value -> index. Before inserting x, check if its complement is already in the map. One pass: O(n) time, O(n) space. Brute force is O(n²).",d:"nums = [2,7,11,15], target = 9\ni=0, x=2, need 7 -> map {} has no 7 -> store {2:0}\ni=1, x=7, need 2 -> map has 2 at index 0 -> return [0,1]"},
"valid-anagram":{w:"Given strings s and t, return true if t is a rearrangement of the letters of s.",t:"Anagrams have identical letter counts. Count letters of s up and letters of t down; all zeros means anagram. Different lengths means false immediately. O(n) time, O(1) space (26 letters). Sorting both strings also works in O(n log n).",d:"s = listen, t = silent\ncount s: l1 i1 s1 t1 e1 n1\nsubtract t letter by letter: every count returns to 0\nall zero -> true"},
"group-anagrams":{w:"Group the words that are anagrams of each other. Order of groups does not matter.",t:"Anagrams share a canonical key: the sorted word, or a 26-length count tuple. Use a hash map key -> list of words. Sorted key costs O(k log k) per word, count key costs O(k). Total about O(n·k).",d:"words = [eat, tea, tan, ate, nat, bat]\neat -> key aet -> {aet:[eat]}\ntea -> aet -> {aet:[eat,tea]}\ntan -> ant -> new group\nate -> aet -> joins first group\nnat -> ant -> joins second group\nbat -> abt -> new group\nresult: [[eat,tea,ate],[tan,nat],[bat]]"},
"top-k-frequent-elements":{w:"Return the k most frequent elements of the array, in any order.",t:"Count frequencies with a hash map, then pick the top k. Min-heap of size k gives O(n log k). Bucket sort gives O(n): make buckets indexed by frequency (max n) and read from the highest bucket down. Mnemonic: Count, Bucket, Collect.",d:"nums = [1,1,1,2,2,3], k = 2\ncount: {1:3, 2:2, 3:1}\nbuckets by frequency: f1:[3]  f2:[2]  f3:[1]\nwalk from f3 down: take 1, take 2 -> k reached\nanswer: [1,2]"},
"product-of-array-except-self":{w:"For each index return the product of all other elements. No division allowed, and it must run in O(n).",t:"answer[i] = (product of everything left of i) x (product of everything right of i). Pass 1 (left to right) stores prefix products in the answer array. Pass 2 (right to left) multiplies in a running suffix product. O(n) time, O(1) extra space excluding the output.",d:"nums = [1,2,3,4]\nprefix pass -> ans = [1,1,2,6]\nsuffix pass, suffix starts at 1:\ni=3: ans=6*1=6,  suffix=4\ni=2: ans=2*4=8,  suffix=12\ni=1: ans=1*12=12, suffix=24\ni=0: ans=1*24=24\nresult: [24,12,8,6]"},
"longest-consecutive-sequence":{w:"Find the length of the longest run of consecutive integers in an unsorted array, in O(n).",t:"Put all numbers in a set. A number x starts a run only if x-1 is NOT in the set. From each start, count upward while x+1 exists. Each number is touched at most twice, so O(n) time and space. Sorting would be O(n log n).",d:"nums = [100,4,200,1,3,2]\n100: 99 missing -> start, 101 missing -> length 1\n4: 3 exists -> skip (not a start)\n200: start, length 1\n1: 0 missing -> start; 2,3,4 all exist -> length 4\nanswer: 4"}
};
function panel(q){const g=G[q.sl],id=esc(q.sl);
const gd=g?`<details class="g" open><summary>Explanation, theory and dry run</summary><div class="lbl">The question</div><p>${esc(g.w)}</p><div class="lbl">Theory</div><p>${esc(g.t)}</p><div class="lbl">Dry run</div><pre>${esc(g.d)}</pre></details>`:`<details class="g"><summary>How to approach this problem</summary><p>A full walkthrough is not added for this one yet. Checklist: (1) restate the question in your own words, (2) write the brute force and its complexity, (3) find the bottleneck and apply the pattern idea above, (4) dry run a small input in a table.</p></details>`;
return gd+`<div class="lbl">Your notes</div><textarea data-n="${id}" placeholder="Approach, complexity, mistakes, similar problems...">${esc(S.nt[q.sl]||"")}</textarea><div class="lbl">Your code snippet</div><textarea class="code" spellcheck="false" data-c="${id}" placeholder="Paste your solution here for revision...">${esc(S.cd[q.sl]||"")}</textarea>`}
const K="dsaplanner.v1",ST=["Todo","Solving","Solved","Revisit"];
let S={st:{},nt:{},pn:{},cu:{},cd:{}};
try{const r=localStorage.getItem(K);if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S));return true}catch(e){return false}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const all=p=>p.items.concat(S.cu[p.id]||[]);
const stt=sl=>S.st[sl]||"Todo";
const link=q=>q.url||"https://leetcode.com/problems/"+q.sl+"/";
const open=new Set(),seen={cur:false};
const $=id=>document.getElementById(id);
function render(){
  const f=$("flt").value;let tot=0,sol=0,rev=0,cur=null;
  D.forEach(p=>{const a=all(p),s=a.filter(q=>stt(q.sl)==="Solved").length;tot+=a.length;sol+=s;rev+=a.filter(q=>stt(q.sl)==="Revisit").length;if(!cur&&s<a.length)cur=p.id});
  if(!seen.cur&&cur){open.add("p:"+cur);seen.cur=true}
  $("ob").style.width=(tot?sol/tot*100:0)+"%";
  $("stats").innerHTML=`<div class="stat"><b>${sol}/${tot}</b>solved</div><div class="stat"><b>${tot?Math.round(sol/tot*100):0}%</b>complete</div><div class="stat"><b>${rev}</b>to revisit</div>`;
  $("list").innerHTML=D.map((p,i)=>{
    const a=all(p),s=a.filter(q=>stt(q.sl)==="Solved").length;
    const rows=a.filter(q=>f==="all"||(f==="todo"&&stt(q.sl)!=="Solved")||stt(q.sl)===f).map(q=>`<div class="pr ${stt(q.sl)==="Solved"?"done":""}"><div class="row">
<select data-s="${esc(q.sl)}">${ST.map(x=>`<option${x===stt(q.sl)?" selected":""}>${x}</option>`).join("")}</select>
<a href="${esc(link(q))}" target="_blank" rel="noopener">${esc(q.t)}</a><span class="d ${q.d}">${{E:"Easy",M:"Medium",H:"Hard"}[q.d]}</span>
<button class="nb" data-nt="${esc(q.sl)}">Guide / Notes / Code${S.nt[q.sl]||S.cd[q.sl]?' <span class="dot">●</span>':""}</button></div>
${open.has("n:"+q.sl)?panel(q):""}</div>`).join("");
    return `<details class="p ${p.id===cur?"cur":""}" data-p="${p.id}"${open.has("p:"+p.id)?" open":""}><summary><span class="num">${i+1}</span><span class="pn">${esc(p.n)}${p.id===cur?'<span class="tag">Current</span>':""}</span><span class="cnt">${s}/${a.length}</span></summary>
<div class="pb"><div class="bar" style="margin-bottom:10px"><i style="width:${a.length?s/a.length*100:0}%"></i></div><div class="tip"><b>Pattern idea:</b> ${esc(p.tip)}</div>
<div class="lbl">Pattern notes (template, edge cases)</div><textarea data-pn="${p.id}" placeholder="Write your own template for this pattern...">${esc(S.pn[p.id]||"")}</textarea>
<div class="lbl">Problems</div>${rows||'<div class="cnt">Nothing matches this filter.</div>'}
<div class="add" data-add="${p.id}"><input type="text" placeholder="Add your own problem title"><input type="text" placeholder="LeetCode link (optional)"><select><option value="E">Easy</option><option value="M" selected>Medium</option><option value="H">Hard</option></select><button>Add</button></div></div></details>`}).join("");
}
const L=$("list");
L.addEventListener("toggle",e=>{const d=e.target;if(d.dataset&&d.dataset.p){d.open?open.add("p:"+d.dataset.p):open.delete("p:"+d.dataset.p)}},true);
L.addEventListener("change",e=>{const t=e.target;if(t.dataset.s){S.st[t.dataset.s]=t.value;save();render()}});
L.addEventListener("input",e=>{const t=e.target;if(t.dataset.n)S.nt[t.dataset.n]=t.value;else if(t.dataset.c)S.cd[t.dataset.c]=t.value;else if(t.dataset.pn)S.pn[t.dataset.pn]=t.value;else return;
  $("sv").textContent=save()?"Saved ✓ "+new Date().toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"}):"Could not save (browser storage blocked)"});
L.addEventListener("keydown",e=>{const t=e.target;if(t.dataset.c&&e.key==="Tab"){e.preventDefault();const s=t.selectionStart;t.value=t.value.slice(0,s)+"    "+t.value.slice(t.selectionEnd);t.selectionStart=t.selectionEnd=s+4;t.dispatchEvent(new Event("input",{bubbles:true}))}});
L.addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;
  if(b.dataset.nt){const k="n:"+b.dataset.nt;open.has(k)?open.delete(k):open.add(k);render()}
  else if(b.parentElement.dataset.add){
    const box=b.parentElement,id=box.dataset.add,ins=box.querySelectorAll("input"),t=ins[0].value.trim();if(!t)return;
    (S.cu[id]=S.cu[id]||[]).push({t,sl:"c"+Date.now(),d:box.querySelector("select").value,url:ins[1].value.trim()});save();render()}
});
$("flt").addEventListener("change",render);
$("ex").onclick=()=>{$("io").style.display="block";$("iot").value=JSON.stringify(S);$("msg").textContent=""};
$("cl").onclick=()=>{$("io").style.display="none"};
$("ld").onclick=()=>{try{const o=JSON.parse($("iot").value);S=Object.assign({st:{},nt:{},pn:{},cu:{},cd:{}},o);save();render();$("msg").textContent="Loaded."}catch(e){$("msg").textContent="That is not a valid backup."}};
render();
if("serviceWorker" in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
</script></body></html>
